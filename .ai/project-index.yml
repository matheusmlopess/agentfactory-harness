meta:
  version: "1.8.0"
  wave: 6
  description: >
    Agent navigation aid — read this before searching src/ or .ai/.
    Updated each wave: add entries for new files, flip status to
    "implemented" on merge. Top-level keys are section names.
    Wave 6 (compartmentalize): platform blocks are now @factory/* workspace
    PACKAGES under packages/*; the app host + features stay in src/.
    See workspace_packages below and docs/features/ARCHITECTURE-BLUEPRINT.
  status_values: [implemented, planned, stub]

workspace_packages:
  - path: packages/orchestration
    purpose: "@factory/orchestration — pure DAG engine (schema, executor, graph, studio-model); deps: zod; TUI-free/reusable"
    wave: 6
    status: implemented
  - path: packages/core
    purpose: "@factory/core — agent-loop, llm adapters, config store, tools, logger, session, version; deps: @anthropic-ai/sdk, openai, zod"
    wave: 6
    status: implemented
  - path: packages/shared
    purpose: "@factory/shared — TUI platform (renderer, input controller/keymap/router, widgets, Panel, tabs); deps: @factory/core (tracked soft spot)"
    wave: 6
    status: implemented
  - path: packages/contracts
    purpose: "@factory/contracts — Feature contract + service bridges + typed ServiceRegistry + FeatureManifest/CONTRACT_VERSION; deps: @factory/{core,orchestration,shared}"
    wave: 6
    status: implemented
  - path: packages/registry
    purpose: "@factory/registry — agentfactory.dev client (auth, login, key import); deps: @factory/core"
    wave: 6
    status: implemented
  - path: tsconfig.base.json
    purpose: "Shared strict/NodeNext compilerOptions extended by root + each package tsconfig"
    wave: 6
    status: implemented

